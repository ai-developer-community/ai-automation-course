[project]
name = "ai-automation-course"
version = "0.1.0"
description = "Advanced AI Automation course: business automations in Python on Google Cloud Run"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "google-api-python-client>=2.150",
    "google-auth>=2.36",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pydantic[email]>=2.9",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "pyright>=1.1.414",
    "pytest>=8",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["automations"]

[tool.ruff]
line-length = 140
src = ["automations"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
ignore = [
    "ANN401",  # Any is allowed where a value really can be anything, such as a model's tool result
    "B008",    # FastAPI declares request bodies with Body(...) in defaults
    "UP017",   # timezone.utc, as shown in the course video
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.pyright]
include = ["automations", "tools"]
extraPaths = ["automations"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
